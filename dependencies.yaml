dependencies:
  - name: nri-supply-chain
    version: 0.5.0
    refPaths:
      - path: cmd/nri-supply-chain/main.go
        match: ^var version
      - path: README.md
        match: "^\\s+verify ghcr.*nri-supply-chain:"
      - path: README.md
        match: '"image".*nri-supply-chain:'
      - path: README.md
        match: "Image.*nri-supply-chain:"
      - path: README.md
        match: "NOTATION.*nri-supply-chain:"
      - path: README.md
        match: "SCAI.*nri-supply-chain:"
      - path: README.md
        match: "RUNTIMETRACE.*nri-supply-chain:"
      - path: README.md
        match: '"detail".*nri-supply-chain:'
      - path: deploy/kubernetes/daemonset.yaml
        match: "image.*nri-supply-chain:"
      - path: deploy/helm/nri-supply-chain/Chart.yaml
        match: "^version:"
      - path: deploy/helm/nri-supply-chain/Chart.yaml
        match: ^appVersion
      - path: internal/registry/registry_bench_test.go
        match: "imageRef.*nri-supply-chain:"

  - name: helm
    version: 3.21.4
    refPaths:
      - path: .github/workflows/ci.yml
        match: "version: v3\\."

  - name: distroless
    version: debian13
    refPaths:
      - path: Dockerfile
        match: "FROM gcr.io/distroless/static-"
      - path: Dockerfile.goreleaser
        match: "FROM gcr.io/distroless/static-"

  - name: golang
    version: 1.27.0
    refPaths:
      - path: Dockerfile
        match: "FROM golang:"
      - path: go.mod
        match: "^go "

  - name: golangci-lint
    version: 2.13.1
    refPaths:
      - path: Makefile
        match: ^GOLANGCI_LINT_VERSION
      - path: .github/workflows/ci.yml
        match: "version: v2\\."

  - name: trivy
    version: 0.74.0
    refPaths:
      - path: .github/workflows/ci.yml
        match: "version: v0\\."
      - path: .github/actions/attest/action.yml
        match: "version: v0\\."

  - name: syft
    version: 1.51.0
    refPaths:
      - path: .github/workflows/ci.yml
        match: syft-version
      - path: .github/workflows/release.yml
        match: syft-version

  - name: zeitgeist
    version: 0.8.0
    refPaths:
      - path: Makefile
        match: ^ZEITGEIST_VERSION

  - name: shfmt
    version: 3.13.1
    refPaths:
      - path: Makefile
        match: ^SHFMT_VERSION

  - name: shellcheck
    version: v0.11.0
    refPaths:
      - path: Makefile
        match: ^SHELLCHECK_VERSION

  - name: kubernix
    version: 0.3.5
    refPaths:
      - path: Makefile
        match: ^KUBERNIX_VERSION

  - name: mdtoc
    version: v1.4.0
    refPaths:
      - path: Makefile
        match: ^MDTOC_VERSION

  - name: cosign
    version: 3.1.3
    refPaths:
      - path: Makefile
        match: ^COSIGN_VERSION

  - name: crane
    version: 0.21.9
    refPaths:
      - path: Makefile
        match: ^CRANE_VERSION

  - name: govulncheck
    version: v1.7.0
    refPaths:
      - path: Makefile
        match: ^GOVULNCHECK_VERSION

  - name: prettier
    version: 3.9.6
    refPaths:
      - path: Makefile
        match: ^PRETTIER_VERSION

  - name: dashboard-linter
    version: 0.3.0
    refPaths:
      - path: Makefile
        match: ^DASHBOARD_LINTER_VERSION

  - name: pause
    version: 3.10
    refPaths:
      - path: test/e2e/helpers.bash
        match: "registry.k8s.io/pause:"
