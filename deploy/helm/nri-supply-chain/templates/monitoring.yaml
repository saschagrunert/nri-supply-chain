{{- if and .Values.monitoring.serviceMonitor.enabled (not .Values.service.enabled) }}
{{- fail "service.enabled must be true when monitoring.serviceMonitor.enabled is true" }}
{{- end }}
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nri-supply-chain.fullname" . }}
  namespace: {{ include "nri-supply-chain.namespace" . }}
  labels:
    {{- include "nri-supply-chain.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nri-supply-chain.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      {{- with .Values.monitoring.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ .Values.monitoring.serviceMonitor.honorLabels }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $job := include "nri-supply-chain.fullname" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nri-supply-chain.fullname" . }}
  namespace: {{ include "nri-supply-chain.namespace" . }}
  labels:
    {{- include "nri-supply-chain.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: nri-supply-chain
      rules:
        - alert: NRISupplyChainPluginDown
          expr: up{job="{{ $job }}"} == 0 or absent(up{job="{{ $job }}"})
          for: {{ .Values.monitoring.prometheusRule.pluginDownFor }}
          labels: {severity: critical}
          annotations:
            summary: Supply-chain plugin is not running or not scraped; containers on affected nodes are not verified unless the runtime requires the plugin.
        - alert: NRISupplyChainNRIDisconnected
          expr: nri_supply_chain_nri_connected == 0
          for: {{ .Values.monitoring.prometheusRule.nriDisconnectedFor }}
          labels: {severity: critical}
          annotations:
            summary: Supply-chain plugin is not connected to the NRI runtime; new containers on this node are not verified unless the runtime requires the plugin.
        - alert: NRISupplyChainVerificationFailures
          expr: sum(rate(nri_supply_chain_verification_total{result="fail"}[5m])) > {{ .Values.monitoring.prometheusRule.failureRateThreshold }}
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Supply-chain verification failures detected.
        - alert: NRISupplyChainCircuitBreakerOpen
          expr: increase(nri_supply_chain_circuit_breaker_trips_total[5m]) > 0
          for: {{ .Values.monitoring.prometheusRule.circuitBreakerFor }}
          labels: {severity: warning}
          annotations:
            summary: Registry circuit breaker is open.
        - alert: NRISupplyChainHighFetchErrorRate
          expr: sum(rate(nri_supply_chain_fetch_errors_total[5m])) > {{ .Values.monitoring.prometheusRule.fetchErrorRateThreshold }}
          for: {{ .Values.monitoring.prometheusRule.fetchErrorFor }}
          labels: {severity: warning}
          annotations:
            summary: Sustained attestation fetch errors from the registry.
        - alert: NRISupplyChainVerificationInterrupted
          expr: sum(increase(nri_supply_chain_verification_interrupted_total[5m])) > 0
          for: {{ .Values.monitoring.prometheusRule.verificationInterruptedFor }}
          labels: {severity: warning}
          annotations:
            summary: Verifications are being interrupted by context cancellation.
        - alert: NRISupplyChainHighAdmissionLatency
          expr: histogram_quantile(0.99, sum by (le, instance) (rate(nri_supply_chain_create_container_duration_seconds_bucket[5m]))) > {{ .Values.monitoring.prometheusRule.admissionLatencyThresholdSeconds }}
          for: {{ .Values.monitoring.prometheusRule.admissionLatencyFor }}
          labels: {severity: warning}
          annotations:
            summary: CreateContainer p99 latency is approaching the runtime's NRI request timeout.
        - alert: NRISupplyChainConfigReloadFailure
          expr: increase(nri_supply_chain_config_reload_errors_total[15m]) > 0
          for: {{ .Values.monitoring.prometheusRule.reloadFailureFor }}
          labels: {severity: warning}
          annotations:
            summary: Supply-chain plugin configuration reload is failing.
        - alert: NRISupplyChainCacheHitRatioLow
          expr: |
            sum(rate(nri_supply_chain_cache_hits_total[15m]))
            / (sum(rate(nri_supply_chain_cache_hits_total[15m]))
               + sum(rate(nri_supply_chain_cache_misses_total[15m])))
            < {{ .Values.monitoring.prometheusRule.cacheHitRatioThreshold }}
          for: {{ .Values.monitoring.prometheusRule.cacheHitRatioFor }}
          labels: {severity: warning}
          annotations:
            summary: Cache hit ratio is below the configured threshold.
        - alert: NRISupplyChainContainersDegraded
          expr: sum(nri_supply_chain_tracked_containers{state="degraded"}) > 0
          for: {{ .Values.monitoring.prometheusRule.containersDegradedFor }}
          labels: {severity: warning}
          annotations:
            summary: Containers in degraded verification state.
        - alert: NRISupplyChainRemediationErrors
          expr: sum(increase(nri_supply_chain_remediation_errors_total[5m])) > 0
          for: {{ .Values.monitoring.prometheusRule.remediationErrorsFor }}
          labels: {severity: critical}
          annotations:
            summary: Remediation UpdateContainers calls are failing.
        - alert: NRISupplyChainContinuousVerifierStale
          expr: (time() - nri_supply_chain_continuous_verifier_last_run) > {{ .Values.monitoring.prometheusRule.continuousVerifierStaleThreshold }} and nri_supply_chain_continuous_verifier_last_run > 0
          for: {{ .Values.monitoring.prometheusRule.continuousVerifierStaleFor }}
          labels: {severity: critical}
          annotations:
            summary: Continuous verifier has not completed a cycle recently.
{{- end }}
