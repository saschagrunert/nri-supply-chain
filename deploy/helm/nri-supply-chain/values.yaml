# Override to deploy the release into a namespace other than .Release.Namespace.
namespaceOverride: ""
namespace:
  create: false

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/saschagrunert/nri-supply-chain
  tag: ""
  # Pin the image by digest (sha256:...) in production. When set, the digest
  # takes precedence over the tag. Verify the image out of band first, see the
  # repository README's "Verifying Releases" section.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  # Lets the plugin's own pod start while no plugin instance is registered,
  # when the runtime's NRI default validator requires this plugin and uses
  # this annotation key for tolerations. See docs/deployment.md#failing-closed.
  tolerate-missing-nri-plugins.noderesource.dev: "true"
podLabels: {}

daemonSet:
  minReadySeconds: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  priorityClassName: system-node-critical
  # Keep it above the plugin's 30s bound for in-flight verifications on
  # shutdown, so SIGTERM ends with exit code 0 instead of a SIGKILL.
  terminationGracePeriodSeconds: 45
  # The plugin reloads config.toml and policies from the ConfigMap volume
  # without a restart. Set to true to also roll the pods on every config
  # change; each rollout briefly leaves the node without the plugin.
  restartOnConfigChange: false
  # Host networking lets the plugin reach registries before the CNI plugin is
  # running on the node, so CNI pods can be verified during bootstrap.
  # NetworkPolicies do not apply to host network pods; restrict the metrics
  # port with host firewall rules instead.
  hostNetwork: true
  # Default resolves registry names through the node's resolver, which works
  # before cluster DNS is up. Use ClusterFirstWithHostNet to resolve in-cluster
  # services (for example an in-cluster registry or GUAC endpoint).
  dnsPolicy: Default
  tolerations:
    - operator: Exists
  nodeSelector:
    kubernetes.io/os: linux
  affinity: {}

# Increase the memory limit on nodes with many images; cache pre-warming runs
# up to 5 concurrent fetches and each attestation can reach maxAttestationSize.
# No CPU limit is set by default: CFS throttling delays CreateContainer
# responses past the runtime's NRI request timeout, which admits containers
# without verification.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# The runtime creates the NRI socket owned by root and not accessible to other
# users, so the container runs as UID 0. All capabilities are dropped and the
# root filesystem is read-only, so root inside the container cannot bypass file
# permissions or modify the image.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Writable emptyDir volumes for the Sigstore TUF cache (mounted as HOME) and
# temporary files, required by the read-only root filesystem.
cacheVolume:
  sizeLimit: 64Mi
tmpVolume:
  sizeLimit: 64Mi

nriSocket:
  hostPath: /var/run/nri
  hostPathType: DirectoryOrCreate

config:
  verification: warn
  fetchTimeout: 30s
  digestResolveTimeout: 1s
  # Leave empty to use the mode-dependent application default.
  fetchFailurePolicy: ""
  cacheTTL: 24h
  cacheFailureTTL: 5m
  verificationTimeout: 5m
  # Upper bound for the CreateContainer hook. Keep it below the runtime's NRI
  # request timeout (2s by default). Leave empty to use the application default.
  admissionTimeout: ""
  fetchRateLimit: 0
  logLevel: ""
  # The chart derives the container and probe port from this address.
  metricsAddr: ":9090"
  circuitBreakerThreshold: 5
  circuitBreakerCooldown: 30s
  maxAttestationSize: 10485760
  cacheMaxEntries: 10000
  # Trusted digests or digest-qualified image references that bypass verification.
  allowlistDigests: []
  policy:
    source: local
    ociRef: ""
    pollInterval: 5m
    issuers: []
    sanPatterns: []
    keys: []
  sigstore:
    enabled: false
    includePublicRoot: true
    roots: []
  registries: []
  guac:
    endpoint: ""
    authTokenPath: ""
    caCert: ""
    timeout: 5s
    fallbackPolicy: warn
    maxDependencies: 5
    checks:
      - certify_vuln
      - certify_scorecard
      - is_dependency
  # Inserted verbatim into config.toml for forward-compatible configuration.
  # It is rendered before any TOML table generated by the chart, so top-level
  # keys work. Place top-level keys before any tables inside extraConfig.
  extraConfig: ""

# Used only when config.policy.source is local. Keys must end in .json.
# IMPORTANT: Replace "myorg" with your organization before deploying. The
# exclude list skips Kubernetes system images so that kube-proxy, CoreDNS, and
# CSI sidecars can start while the plugin bootstraps. Add your CNI images
# (pinned by digest) as needed. Keep this policy in sync with
# deploy/kubernetes/daemonset.yaml (checked by "make verify-manifests").
policies:
  default.json: |
    {
      "trust": {
        "issuers": ["https://token.actions.githubusercontent.com"],
        "sanPatterns": ["https://github.com/myorg/**"],
        "sources": ["https://github.com/myorg/*"]
      },
      "exclude": ["registry.k8s.io/**"],
      "slsa": { "missingPolicy": "warn" },
      "vex": { "missingPolicy": "allow" }
    }

# Mount additional files, for example private Sigstore roots or registry CAs.
extraVolumes: []
extraVolumeMounts: []
extraEnv: []

service:
  enabled: true
  type: ClusterIP
  # The Service may expose a different port than config.metricsAddr.
  port: 9090
  annotations: {}

probes:
  # Port of the dedicated health server (--health-addr) used by the probes.
  # It must differ from the config.metricsAddr port, so a metrics port
  # conflict with a host service does not fail the probes.
  port: 9091
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    failureThreshold: 3
    periodSeconds: 10
  readiness:
    failureThreshold: 3
    periodSeconds: 10

# NetworkPolicies do not apply to host network pods, so the policy is only
# rendered when daemonSet.hostNetwork is false.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: metrics
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    # Keep the plugin's own "namespace" metric label instead of renaming it to
    # "exported_namespace". The dashboard and alerts rely on it.
    honorLabels: true
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    failureRateThreshold: 0
    circuitBreakerFor: 5m
    fetchErrorRateThreshold: 0.1
    fetchErrorFor: 5m
    verificationInterruptedFor: 5m
    # p99 CreateContainer latency threshold in seconds. Keep it below
    # config.admissionTimeout and the runtime's NRI request timeout (2s by
    # default).
    admissionLatencyThresholdSeconds: 1
    admissionLatencyFor: 5m
    pluginDownFor: 2m
    nriDisconnectedFor: 1m
    reloadFailureFor: 15m
    cacheHitRatioThreshold: 0.5
    cacheHitRatioFor: 15m
    containersDegradedFor: 10m
    remediationErrorsFor: 5m
    # Seconds since the last continuous verification cycle. Set it to at least
    # three times remediation.interval. The alert only fires after a cycle has
    # completed, so it stays silent while remediation is disabled.
    continuousVerifierStaleThreshold: 900
    continuousVerifierStaleFor: 5m
  grafana:
    enabled: false
    labels: {}
    annotations: {}
