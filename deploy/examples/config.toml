# NRI Supply Chain Verification Plugin Configuration
#
# Schema version of this config file. Omitting defaults to 1.
# config_version = 1
#
# Master toggle: "disabled" (default), "warn" (log-only), "enforce" (reject on failure).
verification = "warn"

# Per-fetch timeout for retrieving attestations.
fetch_timeout = "30s"

# Behavior on network errors: "allow", "warn" (default), "deny".
# In enforce mode the effective default is "deny" unless set explicitly.
# fetch_failure_policy = "warn"

# How long verification results are cached per image digest + namespace.
# Set to "0s" to disable caching.
cache_ttl = "24h"

# How long failed verification results are cached before retrying.
# Shorter than cache_ttl so transient failures are retried sooner.
cache_failure_ttl = "5m"

# Maximum number of entries in the verification result cache.
# cache_max_entries = 10000

# Per-image verification timeout (covers all checks for one image).
# verification_timeout = "5m"

# Per-fetch timeout for resolving image digests.
# digest_resolve_timeout = "1s"

# Maximum size (bytes) of a single attestation payload to accept.
# max_attestation_size = 10485760

# Directory containing per-namespace JSON policy files.
# <dir>/default.json is the base policy.
# <dir>/<namespace>.json overrides for that namespace.
policy_dir = "/etc/nri-supply-chain/policies"

# Listen address for the Prometheus metrics HTTP server.
metrics_addr = "127.0.0.1:9090"

# Number of consecutive fetch failures before the circuit breaker opens.
# While open, requests short-circuit to fetch_failure_policy.
circuit_breaker_threshold = 5

# Duration the circuit breaker stays open before allowing a probe request.
circuit_breaker_cooldown = "30s"

# Maximum registry fetch requests per second (0 = unlimited).
# fetch_rate_limit = 50

# Log level override from config (takes effect on reload).
# Valid values: "debug", "info", "warn", "error".
# log_level = "info"

# Policy distribution source.
# By default, policies are loaded from policy_dir on disk ("local").
# Set source = "oci" to fetch policies from an OCI registry instead.
# [policy]
# source = "oci"
# oci_ref = "ghcr.io/myorg/supply-chain-policies:v1"
# poll_interval = "5m"
#
# Policy signature verification (requires source = "oci").
# When issuers or keys are configured, the plugin verifies that the OCI
# policy artifact has a valid Sigstore signature before loading policies.
# issuers = ["https://accounts.google.com"]
# san_patterns = ["policy-signer@myorg.iam.gserviceaccount.com"]
# keys = ["/etc/keys/policy-signing.pub"]  # cannot be used together with issuers

# Private Sigstore instance (single root, backward compatible).
# [sigstore]
# tuf_mirror = "https://tuf.internal.example.com"
# tuf_root = "/etc/sigstore/root.json"

# Multiple Sigstore trusted roots (e.g. public + GitHub attestations).
# When using [[sigstore.roots]], the scalar tuf_mirror/tuf_root fields
# above must not be set (they are mutually exclusive).
# [sigstore]
# include_public_root = true
#
# [[sigstore.roots]]
# name = "github"
# tuf_mirror = "https://tuf-repo.github.com"
# tuf_root = "/etc/sigstore/github-tuf-root.json"

# Registry mirror with automatic fallback to the original registry.
# When the mirror is unreachable, requests fall back to ghcr.io.
# [[registries]]
# prefix = "ghcr.io"
# mirror = "mirror.internal.example.com"
