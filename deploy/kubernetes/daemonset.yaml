apiVersion: v1
kind: Namespace
metadata:
  name: nri-supply-chain
  labels:
    # The plugin mounts the host NRI socket (hostPath) and uses the host
    # network namespace, which the baseline and restricted Pod Security
    # levels forbid.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nri-supply-chain-config
  namespace: nri-supply-chain
data:
  config.toml: |
    verification = "warn"
    fetch_timeout = "30s"
    # fetch_failure_policy = "warn"
    cache_ttl = "24h"
    cache_failure_ttl = "5m"
    policy_dir = "/etc/nri-supply-chain/policies"
    # Binds to all interfaces for Prometheus scraping (default is 127.0.0.1:9090).
    # The DaemonSet uses the host network, so this exposes metrics (image
    # references, namespaces, verification outcomes) on every node address.
    # Restrict access to the port with host firewall rules; NetworkPolicies do
    # not apply to host network pods.
    metrics_addr = ":9090"
    circuit_breaker_threshold = 5
    circuit_breaker_cooldown = "30s"
  # IMPORTANT: Replace all "myorg" placeholders below with your organization's
  # actual values before deploying. The exclude list skips Kubernetes system
  # images so that kube-proxy, CoreDNS, and CSI sidecars can start while the
  # plugin bootstraps. Add your CNI images (pinned by digest) as needed. See
  # docs/deployment.md#bootstrapping-and-system-components.
  default.json: |
    {
      "trust": {
        "issuers": ["https://token.actions.githubusercontent.com"],
        "sanPatterns": ["https://github.com/myorg/**"],
        "sources": ["https://github.com/myorg/*"]
      },
      "exclude": ["registry.k8s.io/**"],
      "slsa": { "missingPolicy": "warn" },
      "vex": { "missingPolicy": "allow" }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nri-supply-chain
  namespace: nri-supply-chain
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nri-supply-chain
  namespace: nri-supply-chain
  labels:
    app.kubernetes.io/name: nri-supply-chain
spec:
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: nri-supply-chain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nri-supply-chain
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Lets the plugin's own pod start while no instance of the plugin is
        # registered, when the runtime's NRI default validator requires it and
        # uses this annotation key for tolerations. See
        # docs/deployment.md#failing-closed.
        tolerate-missing-nri-plugins.noderesource.dev: "true"
    spec:
      serviceAccountName: nri-supply-chain
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # Longer than the plugin's 30s bound for in-flight verifications on
      # shutdown, so SIGTERM ends with exit code 0 instead of a SIGKILL.
      terminationGracePeriodSeconds: 45
      # Host networking lets the plugin reach registries before the CNI plugin
      # is running on the node, so CNI pods can be verified during bootstrap.
      # Registry names resolve through the node's resolver. Switch to
      # ClusterFirstWithHostNet if the plugin must resolve in-cluster services.
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: nri-supply-chain
          # Pin the image by digest in production and verify it out of band
          # (see the README's "Verifying Releases" section). The ConfigMap is
          # mounted as directories (not subPath), so edits reach the pod and
          # are picked up by the file watcher without a restart.
          image: ghcr.io/saschagrunert/nri-supply-chain:0.5.3
          args:
            - --config
            - /etc/nri-supply-chain/config/config.toml
            # Serve the probes on their own port, so a metrics port conflict
            # with a host service does not fail them and restart the pod.
            - --health-addr
            - ":9091"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Writable home for the Sigstore TUF cache.
            - name: HOME
              value: /var/cache/nri-supply-chain
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 9091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          # No CPU limit: CFS throttling delays CreateContainer responses past
          # the runtime's NRI request timeout. Size memory for the number of
          # distinct images per node and the attestation size limits.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          # The runtime creates the NRI socket owned by root and not accessible
          # to other users, so the container runs as UID 0. All capabilities
          # are dropped and the root filesystem is read-only, so root inside
          # the container cannot bypass file permissions or modify the image.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri
            - name: config
              mountPath: /etc/nri-supply-chain/config
              readOnly: true
            - name: policies
              mountPath: /etc/nri-supply-chain/policies
              readOnly: true
            - name: cache
              mountPath: /var/cache/nri-supply-chain
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nri-socket
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: nri-supply-chain-config
            items:
              - key: config.toml
                path: config.toml
        - name: policies
          configMap:
            name: nri-supply-chain-config
            items:
              - key: default.json
                path: default.json
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
