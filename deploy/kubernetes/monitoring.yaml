---
apiVersion: v1
kind: Service
metadata:
  name: nri-supply-chain-metrics
  namespace: nri-supply-chain
  labels:
    app.kubernetes.io/name: nri-supply-chain
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: nri-supply-chain
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nri-supply-chain
  namespace: nri-supply-chain
  labels:
    app.kubernetes.io/name: nri-supply-chain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nri-supply-chain
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # Keep the plugin's own "namespace" metric label instead of renaming it
      # to "exported_namespace". The dashboard and alerts rely on it.
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nri-supply-chain
  namespace: nri-supply-chain
  labels:
    app.kubernetes.io/name: nri-supply-chain
spec:
  groups:
    - name: nri-supply-chain
      rules:
        - alert: NRISupplyChainPluginDown
          expr: up{job="nri-supply-chain-metrics"} == 0 or absent(up{job="nri-supply-chain-metrics"})
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: Supply-chain plugin is not running or not scraped; containers on affected nodes are not verified unless the runtime requires the plugin.
        - alert: NRISupplyChainNRIDisconnected
          expr: nri_supply_chain_nri_connected == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: Supply-chain plugin is not connected to the NRI runtime; new containers on this node are not verified unless the runtime requires the plugin.
        - alert: NRISupplyChainVerificationFailures
          expr: sum(rate(nri_supply_chain_verification_total{result="fail"}[5m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Supply-chain verification failures detected.
        - alert: NRISupplyChainCircuitBreakerOpen
          expr: increase(nri_supply_chain_circuit_breaker_trips_total[5m]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Registry circuit breaker is open.
        - alert: NRISupplyChainHighFetchErrorRate
          expr: sum(rate(nri_supply_chain_fetch_errors_total[5m])) > 0.1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Sustained attestation fetch errors from the registry.
        - alert: NRISupplyChainVerificationInterrupted
          expr: sum(increase(nri_supply_chain_verification_interrupted_total[5m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Verifications are being interrupted by context cancellation.
        # Keep the threshold below admission_timeout and the runtime's NRI
        # request timeout (2s by default).
        - alert: NRISupplyChainHighAdmissionLatency
          expr: histogram_quantile(0.99, sum by (le, instance) (rate(nri_supply_chain_create_container_duration_seconds_bucket[5m]))) > 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: CreateContainer p99 latency is approaching the runtime's NRI request timeout.
        - alert: NRISupplyChainConfigReloadFailure
          expr: increase(nri_supply_chain_config_reload_errors_total[15m]) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Supply-chain plugin configuration reload is failing.
        - alert: NRISupplyChainCacheHitRatioLow
          expr: |
            sum(rate(nri_supply_chain_cache_hits_total[15m]))
            / (sum(rate(nri_supply_chain_cache_hits_total[15m]))
               + sum(rate(nri_supply_chain_cache_misses_total[15m])))
            < 0.5
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Cache hit ratio is below 50%.
        - alert: NRISupplyChainContainersDegraded
          expr: sum(nri_supply_chain_tracked_containers{state="degraded"}) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Containers in degraded verification state.
        - alert: NRISupplyChainRemediationErrors
          expr: sum(increase(nri_supply_chain_remediation_errors_total[5m])) > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: Remediation UpdateContainers calls are failing.
        # Set the threshold to at least three times remediation.interval. The
        # alert only fires after a cycle has completed, so it stays silent while
        # remediation is disabled.
        - alert: NRISupplyChainContinuousVerifierStale
          expr: (time() - nri_supply_chain_continuous_verifier_last_run) > 900 and nri_supply_chain_continuous_verifier_last_run > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: Continuous verifier has not completed a cycle in the last 15 minutes.
