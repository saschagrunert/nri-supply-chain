version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "size/XS"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - "size/XS"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      sigstore:
        patterns:
          - "github.com/sigstore/*"
      go-containerregistry:
        patterns:
          - "github.com/google/go-containerregistry"
      go-openapi:
        patterns:
          - "github.com/go-openapi/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      notaryproject:
        patterns:
          - "github.com/notaryproject/*"
      containerd:
        patterns:
          - "github.com/containerd/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      cel:
        patterns:
          - "github.com/google/cel-go"
          - "cel.dev/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - "size/XS"
