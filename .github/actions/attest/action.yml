name: Attest container image
description: Scan, attest VEX/SBOM, verify, and issue VSA

inputs:
  digest:
    description: "Image manifest digest (sha256:...)"
    required: true
  policy-ref:
    description: "Git ref for VSA policy URI (e.g., main or v1.0.0)"
    required: true
  verify-binary:
    description: "Path to nri-supply-chain binary. If empty, uses docker run."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The SLSA generator stores provenance in the cosign .att tag
    # (raw DSSE envelope). Newer cosign versions no longer read .att
    # tags via `cosign download attestation`, so we fetch the tag
    # manifest directly from the registry API instead. The provenance
    # is re-attested as a Sigstore bundle referrer so the verifier
    # discovers it alongside VEX and SBOM attestations.
    - name: Re-attest SLSA provenance
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DIGEST="${{ inputs.digest }}"
        ATT_TAG="sha256-${DIGEST#sha256:}.att"
        REPO="${IMAGE#ghcr.io/}"

        TOKEN=$(curl -sf \
          -u "${{ github.actor }}:${GH_TOKEN}" \
          "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token // empty') || true

        if [ -z "$TOKEN" ]; then
          echo "Failed to obtain registry token, skipping SLSA re-attestation"
          exit 0
        fi

        MANIFEST=$(curl -sf \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          "https://ghcr.io/v2/${REPO}/manifests/${ATT_TAG}" 2>/dev/null) || true

        if [ -z "$MANIFEST" ]; then
          echo "No .att tag found, skipping SLSA re-attestation"
          exit 0
        fi

        LAYER_DIGEST=$(echo "$MANIFEST" | jq -r '
          [(.layers // [])[] | select(.annotations.predicateType == "https://slsa.dev/provenance/v0.2")]
          | first | .digest // empty')

        if [ -z "$LAYER_DIGEST" ]; then
          echo "No SLSA v0.2 provenance in .att tag, skipping"
          exit 0
        fi

        DSSE=$(curl -sfL \
          -H "Authorization: Bearer ${TOKEN}" \
          "https://ghcr.io/v2/${REPO}/blobs/${LAYER_DIGEST}" 2>/dev/null) || true

        if [ -z "$DSSE" ]; then
          echo "Failed to download SLSA provenance blob, skipping"
          exit 0
        fi

        if ! echo "$DSSE" | jq -r '.payload' | base64 -d | jq '.predicate' > /tmp/slsa-predicate.json; then
          echo "Failed to parse SLSA provenance from DSSE envelope, skipping"
          exit 0
        fi
        if ! cosign attest \
          --type https://slsa.dev/provenance/v0.2 \
          --predicate /tmp/slsa-predicate.json \
          --yes \
          "${IMAGE}@${DIGEST}"; then
          echo "::warning::SLSA re-attestation failed, verification may fail"
        fi

    - name: Scan container image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}@${{ inputs.digest }}
        exit-code: "1"
        trivyignores: .trivyignore

    - name: Attest container image VEX
      shell: bash
      run: |
        PRODUCT="pkg:oci/nri-supply-chain@${{ inputs.digest }}"
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Parse .trivyignore for suppressed vulnerability IDs (CVE-* or GO-*)
        SUPPRESSED_IDS=()
        while IFS= read -r line; do
          id=$(echo "$line" | sed 's/#.*//' | xargs)
          if [[ "$id" =~ ^(CVE-[0-9-]+|GO-[0-9-]+)$ ]]; then
            SUPPRESSED_IDS+=("$id")
          fi
        done < .trivyignore

        # Build per-CVE VEX statements for suppressed vulnerabilities
        PER_CVE_STATEMENTS=""
        for id in "${SUPPRESSED_IDS[@]}"; do
          PER_CVE_STATEMENTS+=",
            {
              \"vulnerability\": {\"name\": \"${id}\"},
              \"products\": [{\"@id\": \"${PRODUCT}\"}],
              \"status\": \"not_affected\",
              \"justification\": \"vulnerable_code_not_present\"
            }"
        done

        cat > /tmp/vex-predicate.json <<EOF
        {
          "@context": "https://openvex.dev/ns/v0.2.0",
          "@id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/vex",
          "author": "https://github.com/${{ github.repository }}/.github/workflows/release.yml",
          "timestamp": "${TIMESTAMP}",
          "statements": [
            {
              "vulnerability": {"name": "trivy-scan-clean"},
              "products": [{"@id": "${PRODUCT}"}],
              "status": "not_affected",
              "justification": "vulnerable_code_not_present"
            }${PER_CVE_STATEMENTS}
          ]
        }
        EOF
        cosign attest --predicate /tmp/vex-predicate.json \
          --type https://openvex.dev/ns \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Generate container image SBOM
      shell: bash
      run: syft "${IMAGE}@${{ inputs.digest }}" -o spdx-json=/tmp/sbom.spdx.json

    - name: Attest container image SBOM
      shell: bash
      run: |
        cosign attest --predicate /tmp/sbom.spdx.json \
          --type https://spdx.dev/Document \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Verify container image
      shell: bash
      run: |
        mkdir -p /tmp/verify-policies
        cat > /tmp/verify-policies/default.json <<EOF
        {
          "trust": {
            "issuers": ["https://token.actions.githubusercontent.com"],
            "sanPatterns": [
              "https://github.com/${{ github.repository }}/**",
              "https://github.com/slsa-framework/slsa-github-generator/**"
            ],
            "sources": ["github.com/${{ github.repository_owner }}/*"]
          },
          "slsa": { "missingPolicy": "deny" },
          "vex": { "missingPolicy": "deny" },
          "sbom": { "missingPolicy": "deny" }
        }
        EOF
        cat > /tmp/verify-config.toml <<EOF
        verification = "enforce"
        policy_dir = "/tmp/verify-policies"
        EOF
        if [ -n "${{ inputs.verify-binary }}" ]; then
          ${{ inputs.verify-binary }} \
            --config /tmp/verify-config.toml \
            verify "${IMAGE}@${{ inputs.digest }}"
        else
          docker run --rm \
            -v /tmp/verify-policies:/tmp/verify-policies:ro \
            -v /tmp/verify-config.toml:/tmp/verify-config.toml:ro \
            "${IMAGE}@${{ inputs.digest }}" \
            --config /tmp/verify-config.toml \
            verify "${IMAGE}@${{ inputs.digest }}"
        fi

    # This self-attestation VSA is for bootstrapping only. Because the same
    # workflow that builds the image also attests it, the VSA is not
    # independently verifiable per SLSA requirements.
    - name: Attest container image VSA
      shell: bash
      run: |
        cat > /tmp/vsa-predicate.json <<EOF
        {
          "verifier": {
            "id": "https://github.com/${{ github.repository }}/.github/workflows/release.yml"
          },
          "timeVerified": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "resourceUri": "${IMAGE}@${{ inputs.digest }}",
          "policy": {
            "uri": "https://github.com/${{ github.repository }}/blob/${{ inputs.policy-ref }}/deploy/examples/policies/default.json"
          },
          "verificationResult": "PASSED",
          "verifiedLevels": ["SLSA_BUILD_LEVEL_3"],
          "slsaVersion": "1.0"
        }
        EOF
        cosign attest --predicate /tmp/vsa-predicate.json \
          --type https://slsa.dev/verification_summary/v1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"
