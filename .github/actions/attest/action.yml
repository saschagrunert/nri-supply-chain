name: Attest container image
description: Scan, attest VEX/SBOM/VulnScan/TestResult/Source/BuildEnv/Release, verify, and issue VSA

inputs:
  digest:
    description: "Image manifest digest (sha256:...)"
    required: true
  policy-ref:
    description: "Git ref for VSA policy URI (e.g., main or v1.0.0)"
    required: true
  verify-binary:
    description: "Path to nri-supply-chain binary. If empty, uses docker run."
    required: false
    default: ""
  ci-run-id:
    description: "GitHub Actions run ID of the CI workflow to query test results from."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The SLSA generator stores provenance in the cosign .att tag
    # (raw DSSE envelope). Newer cosign versions no longer read .att
    # tags via `cosign download attestation`, so we fetch the tag
    # manifest directly from the registry API instead. The provenance
    # is re-attested as a Sigstore bundle referrer so the verifier
    # discovers it alongside VEX and SBOM attestations.
    - name: Re-attest SLSA provenance
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DIGEST="${{ inputs.digest }}"
        ATT_TAG="sha256-${DIGEST#sha256:}.att"
        REPO="${IMAGE#ghcr.io/}"

        TOKEN=$(curl -sf \
          -u "${{ github.actor }}:${GH_TOKEN}" \
          "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token // empty') || true

        if [ -z "$TOKEN" ]; then
          echo "Failed to obtain registry token, skipping SLSA re-attestation"
          exit 0
        fi

        MANIFEST=$(curl -sf \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          "https://ghcr.io/v2/${REPO}/manifests/${ATT_TAG}" 2>/dev/null) || true

        if [ -z "$MANIFEST" ]; then
          echo "No .att tag found, skipping SLSA re-attestation"
          exit 0
        fi

        LAYER_DIGEST=$(echo "$MANIFEST" | jq -r '
          [(.layers // [])[] | select(.annotations.predicateType == "https://slsa.dev/provenance/v0.2")]
          | first | .digest // empty')

        if [ -z "$LAYER_DIGEST" ]; then
          echo "No SLSA v0.2 provenance in .att tag, skipping"
          exit 0
        fi

        DSSE=$(curl -sfL \
          -H "Authorization: Bearer ${TOKEN}" \
          "https://ghcr.io/v2/${REPO}/blobs/${LAYER_DIGEST}" 2>/dev/null) || true

        if [ -z "$DSSE" ]; then
          echo "Failed to download SLSA provenance blob, skipping"
          exit 0
        fi

        if ! echo "$DSSE" | jq -r '.payload' | base64 -d | jq '.predicate' > /tmp/slsa-predicate.json; then
          echo "Failed to parse SLSA provenance from DSSE envelope, skipping"
          exit 0
        fi
        if ! cosign attest \
          --type https://slsa.dev/provenance/v0.2 \
          --predicate /tmp/slsa-predicate.json \
          --yes \
          "${IMAGE}@${DIGEST}"; then
          echo "::warning::SLSA re-attestation failed, verification may fail"
        fi

    - name: Scan container image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}@${{ inputs.digest }}
        exit-code: "1"
        trivyignores: .trivyignore
        format: json
        output: /tmp/trivy-results.json
        version: v0.74.0

    - name: Attest container image VEX
      shell: bash
      run: |
        PRODUCT="pkg:oci/nri-supply-chain@${{ inputs.digest }}"
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Parse .trivyignore for suppressed vulnerability IDs (CVE-*, GO-*, or
        # GHSA-*).
        # A suppression only becomes a not_affected VEX statement when the
        # comment block directly above the ID documents an OpenVEX
        # justification, for example:
        #   # vex-justification: vulnerable_code_not_in_execute_path
        #   GO-2026-5932
        # Suppressions without a valid justification are published as
        # under_investigation instead of asserting that the image is not
        # affected.
        VALID_JUSTIFICATIONS="component_not_present vulnerable_code_not_present vulnerable_code_cannot_be_controlled_by_adversary vulnerable_code_not_in_execute_path inline_mitigations_already_exist"
        PER_CVE_STATEMENTS=""
        justification=""
        while IFS= read -r line || [ -n "$line" ]; do
          trimmed="${line#"${line%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          if [ -z "$trimmed" ]; then
            justification=""
            continue
          fi
          if [[ "$trimmed" =~ ^#[[:space:]]*vex-justification:[[:space:]]*([a-z_]+)[[:space:]]*$ ]]; then
            justification="${BASH_REMATCH[1]}"
            continue
          fi
          if [[ "$trimmed" == \#* ]]; then
            continue
          fi
          read -r id _ <<<"$trimmed"
          if [[ ! "$id" =~ ^(CVE-[0-9-]+|GO-[0-9-]+|GHSA(-[0-9a-z]{4}){3})$ ]]; then
            echo "::warning::${id} in .trivyignore is not a recognized vulnerability ID, no VEX statement is published for it"
          else
            if [ -n "$justification" ] && [[ " $VALID_JUSTIFICATIONS " == *" $justification "* ]]; then
              PER_CVE_STATEMENTS+=",
            {
              \"vulnerability\": {\"name\": \"${id}\"},
              \"products\": [{\"@id\": \"${PRODUCT}\"}],
              \"status\": \"not_affected\",
              \"justification\": \"${justification}\"
            }"
            else
              echo "::warning::${id} is suppressed in .trivyignore without a valid vex-justification, publishing it as under_investigation"
              PER_CVE_STATEMENTS+=",
            {
              \"vulnerability\": {\"name\": \"${id}\"},
              \"products\": [{\"@id\": \"${PRODUCT}\"}],
              \"status\": \"under_investigation\"
            }"
            fi
          fi
          justification=""
        done < .trivyignore

        cat > /tmp/vex-predicate.json <<EOF
        {
          "@context": "https://openvex.dev/ns/v0.2.0",
          "@id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/vex",
          "author": "https://github.com/${{ github.repository }}/.github/workflows/release.yml",
          "timestamp": "${TIMESTAMP}",
          "statements": [
            {
              "vulnerability": {"name": "trivy-scan-clean"},
              "products": [{"@id": "${PRODUCT}"}],
              "status": "not_affected",
              "justification": "vulnerable_code_not_present"
            }${PER_CVE_STATEMENTS}
          ]
        }
        EOF
        cosign attest --predicate /tmp/vex-predicate.json \
          --type https://openvex.dev/ns \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Generate container image SBOM
      shell: bash
      run: syft "${IMAGE}@${{ inputs.digest }}" -o spdx-json=/tmp/sbom.spdx.json

    - name: Attest container image SBOM
      shell: bash
      run: |
        cosign attest --predicate /tmp/sbom.spdx.json \
          --type https://spdx.dev/Document \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Attest vulnerability scan results
      shell: bash
      run: |
        TRIVY_VERSION=$(trivy --version 2>/dev/null | head -1 | awk '{print $2}' || echo "unknown")
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Extract vulnerabilities from Trivy JSON output using the in-toto
        # vulnerability predicate layout: severity is a list of
        # {method, score} entries with scores encoded as strings. The same
        # vulnerability can be reported for several packages, so entries are
        # grouped by ID and their severity lists merged, which keeps the most
        # severe rating. A jq failure fails the step instead of attesting an
        # empty result.
        VULNS=$(jq '[
          .Results[]? |
          .Vulnerabilities[]? |
          {
            id: .VulnerabilityID,
            severity: (
              [{method: "trivy", score: (.Severity // "UNKNOWN")}] +
              ([.CVSS.nvd.V3Score // .CVSS.redhat.V3Score // empty] | map({method: "cvss_v3", score: tostring}))
            )
          }
        ] | group_by(.id) | map({id: .[0].id, severity: ([.[].severity[]] | unique)})' /tmp/trivy-results.json)

        jq -n \
          --arg uri "https://trivy.dev" \
          --arg version "$TRIVY_VERSION" \
          --arg scanFinishedOn "$TIMESTAMP" \
          --arg ciRun "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --argjson vulns "$VULNS" \
          '{
            scanner: {uri: $uri, version: $version, result: $vulns},
            metadata: {scanFinishedOn: $scanFinishedOn, ciRun: $ciRun}
          }' > /tmp/vulnscan-predicate.json

        cosign attest --predicate /tmp/vulnscan-predicate.json \
          --type https://in-toto.io/attestation/vulns/v0.2 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Attest test results
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
      run: |
        CI_RUN="${CI_RUN_ID:-${{ github.event.workflow_run.id }}}"

        if [ -z "$CI_RUN" ]; then
          echo "No CI run ID available, skipping test result attestation"
          exit 0
        fi

        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        GO_VERSION=$(go version 2>/dev/null | awk '{print $3}' || echo "unknown")
        CI_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${CI_RUN}"

        SUITES=$(gh api --paginate \
          "repos/${{ github.repository }}/actions/runs/${CI_RUN}/jobs" \
          --jq '.jobs[] | select(.name | test("test|lint|fuzz"; "i")) | {
            name: .name,
            result: (if .conclusion == "success" then "pass" elif .conclusion == "failure" then "fail" else .conclusion end),
            startedAt: .started_at,
            completedAt: .completed_at,
            durationSeconds: (if .started_at and .completed_at then
              (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)))
            else null end)
          }' 2>/dev/null | jq -s '.') || SUITES='[]'

        if [ "$SUITES" = "[]" ]; then
          echo "::warning::No test/lint/fuzz jobs found for run ${CI_RUN}, skipping test result attestation"
          exit 0
        fi

        OVERALL=$(echo "$SUITES" | jq -r 'if all(.result == "pass") then "pass" else "fail" end')

        jq -n \
          --arg result "$OVERALL" \
          --argjson suites "$SUITES" \
          --arg finishedOn "$TIMESTAMP" \
          --arg goVersion "$GO_VERSION" \
          --arg ciRun "$CI_RUN_URL" \
          '{
            result: $result,
            suites: $suites,
            metadata: {
              finishedOn: $finishedOn,
              framework: "go-test",
              goVersion: $goVersion,
              ciRun: $ciRun
            }
          }' > /tmp/testresult-predicate.json

        cosign attest --predicate /tmp/testresult-predicate.json \
          --type https://in-toto.io/attestation/test-result/v0.1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    # The source attestation records the commit the image was built from. On
    # workflow_run events github.sha is the default branch head at the time
    # the release workflow started, not necessarily the commit CI tested and
    # built, so the workflow_run head SHA and branch take precedence. No SLSA
    # source level is claimed because this workflow does not verify the
    # source control requirements for one.
    - name: Attest source provenance
      shell: bash
      env:
        SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      run: |
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        cat > /tmp/source-predicate.json <<EOF
        {
          "sourceLocations": [
            {
              "uri": "https://github.com/${{ github.repository }}",
              "branch": "${SOURCE_BRANCH}",
              "digest": {"sha1": "${SOURCE_SHA}"}
            }
          ],
          "sourceMetadata": {
            "verifiedOn": "${TIMESTAMP}"
          }
        }
        EOF
        cosign attest --predicate /tmp/source-predicate.json \
          --type https://slsa.dev/source/v1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    # Only properties established by the build definition are recorded. The
    # image build pulls base images over the network and its reproducibility
    # is not verified, so no HERMETIC or REPRODUCIBLE claims are made.
    - name: Attest build environment
      shell: bash
      run: |
        GO_VERSION=$(go version 2>/dev/null | awk '{print $3}' || echo "unknown")
        cat > /tmp/buildenv-predicate.json <<EOF
        {
          "environment": [
            {"name": "GITHUB_ACTIONS", "value": "true"},
            {"name": "RUNNER_OS", "value": "${{ runner.os }}"},
            {"name": "RUNNER_ARCH", "value": "${{ runner.arch }}"},
            {"name": "GO_VERSION", "value": "${GO_VERSION}"},
            {"name": "CGO_ENABLED", "value": "0"},
            {"name": "GO_FLAGS", "value": "-mod=vendor -trimpath"}
          ]
        }
        EOF
        cosign attest --predicate /tmp/buildenv-predicate.json \
          --type https://in-toto.io/attestation/build-env/v1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Attest release
      shell: bash
      run: |
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        cat > /tmp/release-predicate.json <<EOF
        {
          "purl": "pkg:oci/${{ github.event.repository.name }}@${{ inputs.digest }}?repository_url=ghcr.io/${{ github.repository_owner }}",
          "releaseType": "production",
          "packageId": "${{ github.event.repository.name }}-${{ inputs.policy-ref }}",
          "metadata": {
            "publishedOn": "${TIMESTAMP}",
            "ciRun": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
        }
        EOF
        cosign attest --predicate /tmp/release-predicate.json \
          --type https://in-toto.io/attestation/release/v0.1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"

    - name: Verify container image
      shell: bash
      run: |
        mkdir -p /tmp/verify-policies
        cat > /tmp/verify-policies/default.json <<EOF
        {
          "trust": {
            "issuers": ["https://token.actions.githubusercontent.com"],
            "sanPatterns": [
              "https://github.com/${{ github.repository }}/**",
              "https://github.com/slsa-framework/slsa-github-generator/**"
            ],
            "sources": ["https://github.com/${{ github.repository_owner }}/*"]
          },
          "slsa": { "missingPolicy": "deny" },
          "vex": { "missingPolicy": "deny" },
          "sbom": { "missingPolicy": "deny" },
          "vulnScan": { "missingPolicy": "warn" },
          "testResult": { "missingPolicy": "warn" },
          "source": { "missingPolicy": "warn" },
          "buildEnv": { "missingPolicy": "warn" },
          "release": { "missingPolicy": "warn" }
        }
        EOF
        cat > /tmp/verify-config.toml <<EOF
        verification = "enforce"
        policy_dir = "/tmp/verify-policies"
        EOF
        if [ -n "${{ inputs.verify-binary }}" ]; then
          ${{ inputs.verify-binary }} \
            --config /tmp/verify-config.toml \
            verify "${IMAGE}@${{ inputs.digest }}"
        else
          docker run --rm \
            -v /tmp/verify-policies:/tmp/verify-policies:ro \
            -v /tmp/verify-config.toml:/tmp/verify-config.toml:ro \
            "${IMAGE}@${{ inputs.digest }}" \
            --config /tmp/verify-config.toml \
            verify "${IMAGE}@${{ inputs.digest }}"
        fi

    # This self-attestation VSA is for bootstrapping only. Because the same
    # workflow that builds the image also attests it, the VSA is not
    # independently verifiable per SLSA requirements.
    - name: Attest container image VSA
      shell: bash
      run: |
        cat > /tmp/vsa-predicate.json <<EOF
        {
          "verifier": {
            "id": "https://github.com/${{ github.repository }}/.github/workflows/release.yml"
          },
          "timeVerified": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "resourceUri": "${IMAGE}@${{ inputs.digest }}",
          "policy": {
            "uri": "https://github.com/${{ github.repository }}/blob/${{ inputs.policy-ref }}/deploy/examples/policies/default.json"
          },
          "verificationResult": "PASSED",
          "verifiedLevels": ["SLSA_BUILD_LEVEL_3"],
          "slsaVersion": "1.0"
        }
        EOF
        cosign attest --predicate /tmp/vsa-predicate.json \
          --type https://slsa.dev/verification_summary/v1 \
          --yes \
          "${IMAGE}@${{ inputs.digest }}"
