name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }})
    permissions:
      contents: read
      packages: write
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to GHCR
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: ${{ github.event_name == 'workflow_run' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}

      - name: Export digest
        if: github.event_name == 'workflow_run'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      deployments: write
      attestations: write
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0

      - name: Sign image
        run: cosign sign --yes "$IMAGE@${{ steps.manifest.outputs.digest }}"

      - name: Attest container provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest container image provenance
        run: |
          cat > /tmp/slsa-provenance.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml",
              "externalParameters": {
                "source": "github.com/${{ github.repository }}"
              },
              "resolvedDependencies": [
                {
                  "uri": "git+https://github.com/${{ github.repository }}@refs/heads/main",
                  "digest": { "sha1": "${{ github.event.workflow_run.head_sha }}" }
                }
              ]
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml"
              },
              "metadata": {
                "invocationId": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }
          }
          EOF
          cosign attest --predicate /tmp/slsa-provenance.json \
            --type slsaprovenance1 \
            --yes \
            "$IMAGE@${{ steps.manifest.outputs.digest }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: .trivyignore
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Attest container image VEX
        run: |
          PRODUCT="pkg:oci/nri-supply-chain@${{ steps.manifest.outputs.digest }}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/vex-predicate.json <<EOF
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/vex",
            "author": "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml",
            "timestamp": "${TIMESTAMP}",
            "statements": [
              {
                "vulnerability": {"name": "trivy-scan-clean"},
                "products": [{"@id": "${PRODUCT}"}],
                "status": "not_affected",
                "justification": "vulnerable_code_not_present"
              }
            ]
          }
          EOF
          cosign attest --predicate /tmp/vex-predicate.json \
            --type https://openvex.dev/ns \
            --yes \
            "$IMAGE@${{ steps.manifest.outputs.digest }}"

      - name: Generate container image SBOM
        run: syft "$IMAGE:latest" -o spdx-json=/tmp/sbom.spdx.json
      - name: Attest container image SBOM
        run: |
          cosign attest --predicate /tmp/sbom.spdx.json \
            --type https://spdx.dev/Document \
            --yes \
            "$IMAGE@${{ steps.manifest.outputs.digest }}"

      - name: Create deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # required_contexts:[] bypasses deployment protection rules so the
          # deployment is created unconditionally without waiting for status checks.
          DEPLOY_ID=$(gh api repos/${{ github.repository }}/deployments \
            --input - \
            --jq '.id' <<EOF
          {"ref":"${{ github.event.workflow_run.head_sha }}","environment":"latest","auto_merge":false,"required_contexts":[]}
          EOF
          )
          gh api repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
            -f state=success \
            -f environment_url="https://ghcr.io/${{ github.repository }}:latest" \
            --silent
