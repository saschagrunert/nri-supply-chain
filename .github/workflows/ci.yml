name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nri-supply-chain
          path: build/nri-supply-chain

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  helm:
    name: verify / helm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - run: make verify-helm

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: test / integration
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nri-supply-chain
          path: build
      - run: chmod +x build/nri-supply-chain
      - uses: bats-core/bats-action@5b1e60c2ee94cb1b44a616ea4b1f466f9d6e38ef # v4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - run: bats --jobs $(nproc) test/integration/

  test-e2e-prepare:
    name: test / e2e / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        run: |
          matrix=$(find test/e2e -name '*.bats' -exec basename {} .bats \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({file: ., display: (gsub("_"; " ") | gsub("-"; " / "))})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-e2e:
    name: test / e2e / ${{ matrix.runtime }} / ${{ matrix.test.display }}
    needs: [build, lint, test-unit, test-e2e-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.test-e2e-prepare.outputs.matrix) }}
        runtime: [crio, containerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nri-supply-chain
          path: build
      - run: chmod +x build/nri-supply-chain
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: bats-core/bats-action@5b1e60c2ee94cb1b44a616ea4b1f466f9d6e38ef # v4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Cache CI tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/kubernix
            build/cosign
            build/crane
          key: ci-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Download kubernix
        run: make build/kubernix
      - name: Download cosign and crane
        run: make build/cosign build/crane
      - name: Configure kernel parameters
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          sudo sysctl -w net.ipv4.ip_forward=1
      - run: sudo -E env "PATH=$PATH" CRI_RUNTIME=${{ matrix.runtime }} "$(which bats)" test/e2e/${{ matrix.test.file }}.bats
      - name: Collect debug logs
        if: failure() || cancelled()
        run: |
          KUBECONFIG=$(sudo find /tmp "$RUNNER_TEMP" -maxdepth 8 -name 'admin.kubeconfig' -path '*/kubernix/*' 2>/dev/null | head -1)
          if [ -n "$KUBECONFIG" ]; then
            export KUBECONFIG
            echo "=== kubectl get nodes ===" && sudo -E kubectl get nodes -o wide --request-timeout=5s 2>&1 || true
            echo "=== kubectl get pods --all-namespaces ===" && sudo -E kubectl get pods --all-namespaces -o wide --request-timeout=5s 2>&1 || true
            echo "=== kubectl get events ===" && sudo -E kubectl get events --all-namespaces --sort-by='.lastTimestamp' --request-timeout=5s 2>&1 | tail -50 || true
          fi
          sudo find /tmp "$RUNNER_TEMP" -maxdepth 8 -name '*.log' \( -path '*/kubernix/*' -o -path '*/plugin.log' \) -exec sh -c 'echo "=== {} ===" && tail -200 "$1"' _ {} \; 2>/dev/null || true

  test-fuzz-prepare:
    name: fuzz / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        run: |
          tmp=$(mktemp)
          grep -rn '^func Fuzz' --include='*_test.go' . \
            | grep -v '\.claude/' \
            | sed 's|^\./||' \
            | while IFS=: read -r file _ line; do
                fn=$(echo "$line" | grep -oP 'Fuzz\w+')
                dir=$(dirname "$file")
                echo "$dir $fn"
              done > "$tmp"
          matrix=$(cat "$tmp" | while read -r dir fn; do
            count=$(grep -c "^$dir " "$tmp")
            pkg="./$dir/"
            leaf=$(basename "$dir")
            if [ "$count" -eq 1 ]; then
              name="$leaf"
            else
              suffix=$(echo "$fn" | sed 's/^Fuzz//' \
                | sed 's/\([a-z]\)\([A-Z]\)/\1-\2/g' \
                | tr '[:upper:]' '[:lower:]' \
                | sed "s/^${leaf}-//")
              name="$leaf-$suffix"
            fi
            echo "{\"name\":\"$name\",\"package\":\"$pkg\",\"target\":\"$fn\"}"
          done | jq -s -c '.')
          rm -f "$tmp"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-fuzz:
    name: fuzz / ${{ matrix.fuzz.name }}
    needs: [test-fuzz-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.test-fuzz-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.fuzz.package }}testdata/fuzz
          key: fuzz-corpus-${{ matrix.fuzz.name }}-${{ github.sha }}
          restore-keys: fuzz-corpus-${{ matrix.fuzz.name }}-
      - run: go test -fuzz=${{ matrix.fuzz.target }} -fuzztime=30s ${{ matrix.fuzz.package }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make govulncheck

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.74.0

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  snapshot:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --skip=sign --clean

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/zeitgeist
          key: zeitgeist-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make verify-dependencies

  shfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/shfmt
          key: shfmt-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make verify-shfmt

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/shellcheck
          key: shellcheck-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make verify-shellcheck

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  jsonschema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-jsonschema

  mdtoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-mdtoc

  mod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify

  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-vendor

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make verify-tidy

  dashboard-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dashboard-linter
          key: dashboard-linter-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make verify-dashboard

  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make verify-prettier
